[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mainframe-vsam-azure-offload-demo"
version = "0.3.0"
description = "Reference pattern for recoverable offload of VSAM-like records to Azure Cosmos DB."
requires-python = ">=3.11"
dependencies = [
    "azure-cosmos>=4.7.0",
    "azure-eventhub>=5.12.0",
    "azure-eventhub-checkpointstoreblob>=1.1.4",
    "azure-identity>=1.17.0",
    "azure-storage-blob>=12.22.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["src"]
